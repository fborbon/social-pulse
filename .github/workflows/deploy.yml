# Required GitHub secrets:
#   EC2_HOST    — public IP or hostname of the EC2 instance
#   EC2_USER    — SSH user (e.g. ubuntu)
#   EC2_SSH_KEY — private key whose public key is in EC2 ~/.ssh/authorized_keys

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Pull, install deps, restart service on EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/social-pulse
            # social_pulse.db is live collection data — it must never be reset to
            # the stale git-committed copy. Back it up and restore it around the
            # reset so a deploy can never wipe live data (same class of incident
            # that once destroyed cv-builder's live data/cv.json).
            [ -f social_pulse.db ] && cp social_pulse.db /tmp/social_pulse.db.deploy-backup
            git fetch origin main
            git reset --hard origin/main
            [ -f /tmp/social_pulse.db.deploy-backup ] && mv /tmp/social_pulse.db.deploy-backup social_pulse.db
            pip3 install --quiet --break-system-packages \
              fastapi "uvicorn[standard]" aiohttp feedparser pydantic \
              pydantic-settings "strawberry-graphql[fastapi]" anthropic \
              httpx python-dotenv aiofiles aiosqlite apscheduler \
              scikit-learn numpy atproto
            sudo systemctl restart social-pulse
            sleep 3
            sudo systemctl is-active social-pulse
            echo "✓ Social Pulse deployed at $(date -u)"
